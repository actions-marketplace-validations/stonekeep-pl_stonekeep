# Publishes the free (Apache-2.0) packages to npm with provenance when a version tag (v*) is pushed.
# Needs the NPM_TOKEN secret and ownership of the @stonekeep scope on npm.
# The commercial server and console live in a separate private repository.
name: Release
on:
  push: { tags: ['npm-v*'] } # v* tags are GitHub Action releases
permissions: { contents: read, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm -r --filter "!@stonekeep/docs" publish --access public --no-git-checks
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}', NPM_CONFIG_PROVENANCE: 'true' }
